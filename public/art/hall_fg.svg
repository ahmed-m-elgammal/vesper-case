    <ellipse cx="480" cy="905" rx="760" ry="95" fill="#3a3f52" opacity="0.20"/>
    <ellipse cx="1720" cy="900" rx="760" ry="88" fill="#3a3f52" opacity="0.20"/>
    <ellipse cx="1160" cy="918" rx="520" ry="66" fill="#3a3f52" opacity="0.14"/>
    <ellipse cx="70" cy="40" rx="350" ry="245" fill="#3a3f52" opacity="0.13"/>
    <ellipse cx="2330" cy="55" rx="350" ry="245" fill="#3a3f52" opacity="0.13"/>
  </g>

  <!-- faint cobweb in the top-left corner -->
  <g filter="url(#hfWobble)" stroke="#8fa3b0" fill="none" stroke-linecap="round" opacity="0.25" stroke-width="1.9">
    <path d="M38 36 L310 56 M38 36 L258 156 M38 36 L170 256 M38 36 L62 304"/>
    <path d="M138 50 Q133 66 124 84 M124 84 Q112 98 95 117 M95 117 Q79 122 58 132"/>
    <path d="M206 64 Q198 92 184 124 M184 124 Q162 146 134 175 M134 175 Q104 184 70 199"/>
    <path d="M276 76 Q248 112 214 158 M214 158 Q196 190 172 231 M172 231 Q132 246 84 267"/>
    <path d="M58 132 Q50 162 57 186"/>
    <circle cx="38" cy="36" r="2.5" fill="#8fa3b0" fill-opacity="0.35" stroke="none"/>
  </g>

  <!-- dust motes drifting mid-height -->
  <g fill="#e8c97a" fill-opacity="0.16" stroke="none">
    <circle cx="260" cy="320" r="3"/>
    <circle cx="420" cy="480" r="2.5"/>
    <circle cx="560" cy="260" r="3.5"/>
    <circle cx="705" cy="560" r="2"/>
