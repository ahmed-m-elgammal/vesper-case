<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 900" width="2400" height="900">
  <defs>
    <filter id="hfWobble" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.014" numOctaves="2" seed="47" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6"/>
    </filter>
    <filter id="hfSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="hfSoft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- doorway post cast shadow -->
  <g filter="url(#hfSoft2)">
    <ellipse cx="2308" cy="460" rx="30" ry="460" fill="#3a3f52" opacity="0.12"/>
  </g>

  <!-- right-edge doorway post: viewer standing in the far doorway -->
  <g filter="url(#hfWobble)" stroke="#2e2a33" fill="none" stroke-linecap="round">
    <rect x="2324" y="0" width="74" height="900" fill="#8a6a4f" fill-opacity="0.55" stroke-width="5"/>
    <path d="M2328 0 L2328 900" stroke="#e9dfc8" stroke-width="2" opacity="0.35"/>
    <path d="M2340 0 L2340 900" stroke-width="2.4" opacity="0.5"/>
    <path d="M2358 40 C 2362 160 2354 300 2360 440 C 2365 580 2356 720 2361 880" stroke-width="2" opacity="0.3"/>
    <path d="M2382 20 C 2378 180 2386 340 2380 500 C 2375 660 2384 760 2380 890" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- night vignette: bottom edge and top corners -->
