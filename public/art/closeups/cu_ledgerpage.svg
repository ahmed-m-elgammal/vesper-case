<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="cuLpW" x="-8%" y="-8%" width="116%" height="116%"><feTurbulence type="fractalNoise" baseFrequency="0.011 0.014" numOctaves="2" seed="61" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="7"/></filter>
    <filter id="cuLpS" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="800" height="600" fill="#f4ecdb"/>
  <g filter="url(#cuLpS)">
    <ellipse cx="78" cy="76" rx="58" ry="38" fill="#c9a25e" opacity="0.12"/>
    <ellipse cx="736" cy="524" rx="66" ry="42" fill="#9aa88f" opacity="0.12"/>
    <ellipse cx="706" cy="86" rx="46" ry="30" fill="#c9a25e" opacity="0.10"/>
    <ellipse cx="88" cy="542" rx="50" ry="30" fill="#9aa88f" opacity="0.10"/>
  </g>
  <g filter="url(#cuLpW)" fill="none" stroke="#2e2a33" stroke-linecap="round">
    <rect x="14" y="14" width="772" height="572" stroke-width="2.8"/>
    <rect x="22" y="22" width="756" height="556" stroke-width="1.6" opacity="0.75"/>
  </g>
  <g filter="url(#cuLpS)"><ellipse cx="400" cy="118" rx="300" ry="24" fill="#2e2a33" opacity="0.1"/></g>

  <!-- flour-dusted counter under the book -->
  <g filter="url(#cuLpW)" stroke="#2e2a33" fill="none" stroke-linejoin="round">
    <path d="M60 480 Q400 462 740 478 L740 560 Q400 578 60 562 Z" fill="#8a6a4f" fill-opacity="0.4" stroke-width="4"/>
    <ellipse cx="400" cy="472" rx="300" ry="16" fill="#d9c8a6" opacity="0.5"/>
  </g>

  <!-- the rounds book, open -->
  <g filter="url(#cuLpW)" stroke="#2e2a33" stroke-linejoin="round">
    <path d="M96 130 Q250 110 400 128 Q550 110 704 130 L704 506 Q550 524 400 510 Q250 524 96 506 Z" fill="#8a6a4f" fill-opacity="0.5" stroke-width="5"/>
    <path d="M100 142 Q250 122 394 140 L394 498 Q250 516 100 500 Z" fill="#f4ecdb" stroke-width="3.5"/>
    <path d="M406 140 Q550 122 700 142 L700 500 Q550 516 406 498 Z" fill="#f7f0e0" stroke-width="3.5"/>
    <path d="M100 136 Q250 117 394 134 M700 136 Q550 117 406 134" fill="none" stroke-width="1.4" opacity="0.45"/>
    <path d="M100 506 Q250 522 394 504 M700 506 Q550 522 406 504" fill="none" stroke-width="1.4" opacity="0.45"/>
    <path d="M394 142 L406 142 M394 498 L406 498" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- left page: the rounds, hour by hour -->
  <g filter="url(#cuLpW)" fill="none" stroke="#2e2a33" stroke-linecap="round">
    <text x="118" y="196" font-size="27">10:35 -- bread in,</text>
    <text x="142" y="230" font-size="27">wireless on</text>
    <text x="118" y="286" font-size="27">10:47 -- dark;</text>
    <text x="142" y="320" font-size="27">lantern lit</text>
    <text x="118" y="376" font-size="27">11:21 -- lights back,</text>
    <text x="142" y="410" font-size="27">kitchen empty</text>
    <text x="118" y="466" font-size="27">11:30 -- garden door</text>
  </g>

  <!-- right page: the door line, pressed hard -->
  <g filter="url(#cuLpW)" fill="none" stroke="#2e2a33" stroke-linecap="round">
    <text x="424" y="196" font-size="27">OFF its bolt --</text>
    <text x="448" y="230" font-size="27">bolted it. Never</text>
    <text x="448" y="264" font-size="27">left it so.</text>
    <path d="M426 300 Q560 288 682 300 M426 330 Q560 318 682 330 M426 360 Q560 348 682 360 M426 390 Q560 378 682 390" stroke-width="2" opacity="0.28"/>
    <text x="430" y="446" font-family="Caveat, cursive" font-size="26" opacity="0.8">31 years, and this once</text>
  </g>

  <!-- pencil lying in the spine -->
  <g filter="url(#cuLpW)" stroke="#2e2a33" fill="none" stroke-linecap="round">
    <path d="M388 540 L414 462" stroke-width="7"/>
    <path d="M388 540 L414 462" stroke="#c9a25e" stroke-width="5"/>
    <path d="M410 470 l8 -14" stroke="#2e2a33" stroke-width="4"/>
    <path d="M380 548 l10 -6" stroke="#2e2a33" stroke-width="6"/>
  </g>

  <text x="600" y="120" font-family="Caveat, cursive" font-size="28" fill="#2e2a33" text-anchor="start">in her own hand,</text>
  <text x="618" y="152" font-family="Caveat, cursive" font-size="28" fill="#2e2a33" text-anchor="start">at the time.</text>
</svg>
