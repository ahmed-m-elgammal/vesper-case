<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="cuTnW" x="-8%" y="-8%" width="116%" height="116%"><feTurbulence type="fractalNoise" baseFrequency="0.011 0.014" numOctaves="2" seed="67" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="7"/></filter>
    <filter id="cuTnS" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="800" height="600" fill="#f4ecdb"/>
  <g filter="url(#cuTnS)">
    <ellipse cx="78" cy="76" rx="58" ry="38" fill="#8fa3b0" opacity="0.14"/>
    <ellipse cx="736" cy="524" rx="66" ry="42" fill="#c9a25e" opacity="0.12"/>
    <ellipse cx="706" cy="86" rx="46" ry="30" fill="#3a3f52" opacity="0.10"/>
    <ellipse cx="88" cy="542" rx="50" ry="30" fill="#9aa88f" opacity="0.10"/>
  </g>
  <g filter="url(#cuTnW)" fill="none" stroke="#2e2a33" stroke-linecap="round">
    <rect x="14" y="14" width="772" height="572" stroke-width="2.8"/>
    <rect x="22" y="22" width="756" height="556" stroke-width="1.6" opacity="0.75"/>
  </g>

  <!-- the window beyond: rain, grey light -->
  <g filter="url(#cuTnW)" stroke="#2e2a33" fill="none" stroke-linecap="round">
    <rect x="120" y="80" width="300" height="330" fill="#8fa3b0" fill-opacity="0.22" stroke-width="5"/>
    <path d="M270 80 V410 M120 245 H420" stroke-width="3.4"/>
    <path d="M160 110 q6 50 -2 96 M204 124 q8 44 2 88 M320 106 q-6 52 0 96 M356 128 q6 42 -2 86 M186 268 q6 44 -2 88 M300 272 q8 40 0 84" stroke="#f4ecdb" stroke-width="2.4" opacity="0.5"/>
    <path d="M120 410 H420" stroke-width="6"/>
  </g>

  <!-- the sill shelf -->
  <g filter="url(#cuTnW)" stroke="#2e2a33" fill="none" stroke-linejoin="round">
    <path d="M70 452 Q400 432 730 450 L730 542 Q400 560 70 544 Z" fill="#8a6a4f" fill-opacity="0.45" stroke-width="4"/>
    <path d="M110 480 Q400 464 690 478 M130 512 Q400 498 670 510" stroke-width="1.8" opacity="0.3"/>
  </g>

  <!-- the tonic bottle: amber glass, the doctor's label -->
  <g filter="url(#cuTnW)" stroke="#2e2a33" stroke-linejoin="round" fill="none">
    <path d="M430 452 V300 Q430 288 442 288 H458 Q470 288 470 300 V452 Z" fill="#b4762d" fill-opacity="0.6" stroke-width="4"/>
    <path d="M444 288 V258 Q444 250 452 250 H448 Q456 250 456 258 V288" fill="#8a6a4f" fill-opacity="0.7" stroke-width="3.5"/>
    <rect x="436" y="252" width="28" height="16" fill="#3a3f52" fill-opacity="0.4" stroke-width="2.5"/>
    <!-- white label: iron and quinine -->
    <rect x="434" y="330" width="32" height="76" fill="#f4ecdb" fill-opacity="0.9" stroke-width="2.5"/>
    <text x="450" y="352" font-size="13" text-anchor="middle">TONIC</text>
    <path d="M440 362 H460 M440 372 H458 M440 382 H456" stroke-width="1.6" opacity="0.6"/>
    <text x="450" y="400" font-size="11" text-anchor="middle">iron &amp; quinine</text>
    <path d="M436 470 q14 6 28 0" stroke-width="2.4" opacity="0.5"/>
  </g>
  <!-- amber glow through the bottle -->
  <g filter="url(#cuTnS)">
    <ellipse cx="450" cy="370" rx="40" ry="90" fill="#b4762d" opacity="0.18"/>
  </g>

  <!-- the glass: rinsed, inverted, drying -->
  <g filter="url(#cuTnW)" stroke="#2e2a33" stroke-linejoin="round" fill="none">
    <path d="M560 452 H654 L640 388 H574 Z" fill="#d9e4e8" fill-opacity="0.35" stroke-width="4"/>
    <path d="M586 388 q21 -14 42 0" stroke-width="3" opacity="0.7"/>
    <path d="M582 404 q25 -12 50 0" stroke="#f4ecdb" stroke-width="2.4" opacity="0.5"/>
    <path d="M596 452 q-8 -30 4 -60 M620 452 q8 -28 -2 -58" stroke-width="1.8" opacity="0.4"/>
    <!-- dry ring beneath -->
    <ellipse cx="607" cy="456" rx="52" ry="9" fill="none" stroke="#3a3f52" stroke-width="2.4" opacity="0.45"/>
    <!-- water flecks on the shelf -->
    <circle cx="530" cy="470" r="3" fill="#3a3f52" opacity="0.3"/>
    <circle cx="544" cy="480" r="2.4" fill="#3a3f52" opacity="0.3"/>
    <circle cx="676" cy="474" r="2.6" fill="#3a3f52" opacity="0.3"/>
  </g>

  <text x="500" y="130" font-family="Caveat, cursive" font-size="30" fill="#2e2a33" text-anchor="start">rinsed, turned down,</text>
  <text x="516" y="166" font-family="Caveat, cursive" font-size="30" fill="#2e2a33" text-anchor="start">left for Colette --</text>
  <text x="532" y="202" font-family="Caveat, cursive" font-size="30" fill="#2e2a33" text-anchor="start">no hurry in it at all.</text>
</svg>
