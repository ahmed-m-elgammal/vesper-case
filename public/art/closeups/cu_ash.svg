<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="cpAshWobble" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.014" numOctaves="2" seed="67" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
    </filter>
    <filter id="cpAshSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#f4ecdb"/>

  <!-- faint corner stains -->
  <g filter="url(#cpAshSoft)">
    <ellipse cx="46" cy="40" rx="120" ry="78" fill="#c9a25e" opacity="0.12"/>
    <ellipse cx="766" cy="562" rx="140" ry="92" fill="#b0705a" opacity="0.12"/>
    <ellipse cx="762" cy="44" rx="96" ry="66" fill="#8fa3b0" opacity="0.10"/>
    <ellipse cx="44" cy="556" rx="108" ry="76" fill="#3a3f52" opacity="0.10"/>
  </g>

  <!-- plain grey hearth-ash bed, outside the lens -->
  <g filter="url(#cpAshSoft)">
    <ellipse cx="400" cy="300" rx="390" ry="270" fill="#8fa3b0" opacity="0.2"/>
    <ellipse cx="400" cy="470" rx="380" ry="120" fill="#3a3f52" opacity="0.10"/>
  </g>
  <g fill="#6b6472" opacity="0.3">
    <circle cx="90" cy="120" r="2.4"/><circle cx="140" cy="90" r="1.8"/><circle cx="200" cy="60" r="2.2"/>
    <circle cx="560" cy="60" r="2"/><circle cx="680" cy="120" r="2.6"/><circle cx="720" cy="200" r="1.8"/>
    <circle cx="730" cy="320" r="2.4"/><circle cx="740" cy="480" r="2"/><circle cx="660" cy="520" r="2.2"/>
    <circle cx="170" cy="540" r="2.4"/><circle cx="100" cy="340" r="2"/><circle cx="90" cy="220" r="1.8"/>
    <circle cx="120" cy="480" r="2.2"/><circle cx="700" cy="420" r="2"/>
  </g>
  <g stroke="#2e2a33" stroke-width="1.8" opacity="0.35" fill="none" stroke-linecap="round">
    <path d="M96 260 l14 6 M700 260 l-14 8 M170 500 l16 5 M640 60 l14 6"/>
  </g>

  <!-- magnifier lens glass -->
  <circle cx="370" cy="285" r="198" fill="#f7f2e4" opacity="0.92"/>
  <circle cx="370" cy="285" r="190" fill="#8fa3b0" opacity="0.08"/>
  <path d="M232 168 A186 186 0 0 1 300 122" fill="none" stroke="#f4ecdb" stroke-width="12" opacity="0.5" stroke-linecap="round"/>

  <!-- magnified ash inside the lens -->
  <g fill="#6b6472" opacity="0.4">
    <circle cx="300" cy="180" r="3"/><circle cx="250" cy="260" r="2.6"/><circle cx="320" cy="300" r="2.4"/>
    <circle cx="410" cy="180" r="3.2"/><circle cx="470" cy="340" r="2.6"/><circle cx="380" cy="380" r="3"/>
    <circle cx="280" cy="360" r="2.4"/><circle cx="450" cy="180" r="2.4"/><circle cx="420" cy="420" r="2.8"/>
    <circle cx="250" cy="320" r="2.6"/><circle cx="500" cy="260" r="2.4"/><circle cx="330" cy="140" r="2.6"/>
  </g>
  <g stroke="#6b6472" stroke-width="1.8" opacity="0.25" fill="none" stroke-linecap="round">
    <path d="M260 220 Q300 210 340 224"/>
    <path d="M300 390 Q350 400 400 392"/>
    <path d="M440 200 Q480 214 500 250"/>
  </g>

  <!-- charred stem fragments -->
  <g stroke="#2e2a33" fill="none" stroke-linecap="round">
    <path d="M292 214 L354 240" stroke-width="5"/>
    <path d="M308 222 L314 216" stroke-width="3"/>
    <path d="M332 332 L400 354" stroke-width="4"/>
    <path d="M364 342 L374 334" stroke-width="3"/>
    <path d="M418 216 L452 236" stroke-width="3.5"/>
  </g>
  <circle cx="358" cy="242" r="4.5" fill="#2e2a33" opacity="0.85"/>
  <circle cx="334" cy="330" r="3.4" fill="#2e2a33" opacity="0.8"/>

  <!-- two vivid purple petal fragments -->
  <path d="M410 302 C402 286 418 270 440 275 C460 280 464 300 448 310 C432 318 416 314 410 302 Z" fill="#7b5ea7" opacity="0.92"/>
  <path d="M414 300 Q432 286 454 292" fill="none" stroke="#3a3f52" stroke-width="1.5" opacity="0.5"/>
  <path d="M334 356 C328 342 342 332 358 337 C374 342 376 357 362 363 C348 368 340 364 334 356 Z" fill="#7b5ea7" opacity="0.92"/>
  <path d="M338 354 Q352 344 370 348" fill="none" stroke="#3a3f52" stroke-width="1.5" opacity="0.4"/>

  <!-- pale leaf midrib -->
  <path d="M468 178 Q504 238 486 302" fill="none" stroke="#9aa88f" stroke-width="5.5" stroke-linecap="round"/>
  <g stroke="#9aa88f" stroke-width="2" opacity="0.85" fill="none" stroke-linecap="round">
    <path d="M482 212 L498 206 M490 244 L504 242 M490 274 L502 278"/>
  </g>
  <path d="M468 178 Q504 238 486 302" fill="none" stroke="#f4ecdb" stroke-width="1.5" opacity="0.6"/>

  <!-- lens rim and handle -->
  <g filter="url(#cpAshWobble)" stroke="#2e2a33" fill="none" stroke-linecap="round">
    <circle cx="370" cy="285" r="205" stroke-width="7"/>
    <circle cx="370" cy="285" r="193" stroke-width="2.5" opacity="0.7"/>
  </g>
  <path d="M514 400 Q506 412 514 422 L618 538 Q628 550 644 542 Q656 534 646 522 L542 406 Q532 394 514 400 Z" fill="#3a3f52" fill-opacity="0.85" stroke="#2e2a33" stroke-width="3"/>
  <g stroke="#f4ecdb" stroke-width="2" opacity="0.4" stroke-linecap="round">
    <path d="M560 452 l12 12 M584 478 l12 12 M608 504 l12 12"/>
  </g>
  <path d="M512 398 L546 434" stroke="#c9a25e" stroke-width="9" opacity="0.65" stroke-linecap="round"/>

  <!-- annotation -->
  <text x="56" y="552" font-family="Caveat, cursive" font-size="28" fill="#2e2a33">foxglove petals — burned</text>
  <g stroke="#2e2a33" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M268 538 Q298 518 326 498"/>
    <path d="M326 498 l-10 1 M326 498 l2 10"/>
  </g>

  <!-- double ink border -->
  <g filter="url(#cpAshWobble)" fill="none" stroke="#2e2a33" stroke-linecap="round">
    <rect x="14" y="14" width="772" height="572" stroke-width="3"/>
    <rect x="22" y="22" width="756" height="556" stroke-width="1.6"/>
  </g>
</svg>
