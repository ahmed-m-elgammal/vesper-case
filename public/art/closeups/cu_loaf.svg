<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="cuLfW" x="-8%" y="-8%" width="116%" height="116%"><feTurbulence type="fractalNoise" baseFrequency="0.011 0.014" numOctaves="2" seed="51" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="7"/></filter>
    <filter id="cuLfS" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="cuLfS2" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="800" height="600" fill="#f4ecdb"/>
  <g filter="url(#cuLfS)">
    <ellipse cx="78" cy="76" rx="58" ry="38" fill="#b4552d" opacity="0.10"/>
    <ellipse cx="736" cy="524" rx="66" ry="42" fill="#9aa88f" opacity="0.12"/>
    <ellipse cx="706" cy="86" rx="46" ry="30" fill="#c9a25e" opacity="0.10"/>
    <ellipse cx="88" cy="542" rx="50" ry="30" fill="#3a3f52" opacity="0.10"/>
  </g>
  <g filter="url(#cuLfW)" fill="none" stroke="#2e2a33" stroke-linecap="round">
    <rect x="14" y="14" width="772" height="572" stroke-width="2.8"/>
    <rect x="22" y="22" width="756" height="556" stroke-width="1.6" opacity="0.75"/>
  </g>

  <!-- wooden table top -->
  <g filter="url(#cuLfW)" stroke="#2e2a33" stroke-linejoin="round" fill="none">
    <path d="M60 320 Q400 296 740 318 L740 560 Q400 582 60 560 Z" fill="#8a6a4f" fill-opacity="0.4" stroke-width="4"/>
    <path d="M100 370 Q400 348 700 368 M120 440 Q400 420 680 438 M140 506 Q400 490 660 504" stroke-width="1.8" opacity="0.3"/>
  </g>

  <!-- scorch streaks on the table -->
  <g filter="url(#cuLfS2)">
    <ellipse cx="400" cy="420" rx="180" ry="46" fill="#3a2f28" opacity="0.20"/>
    <ellipse cx="400" cy="416" rx="120" ry="30" fill="#2e2a33" opacity="0.16"/>
  </g>

  <!-- baking sheet -->
  <g filter="url(#cuLfW)" stroke="#2e2a33" stroke-linejoin="round" fill="none">
    <path d="M180 430 Q400 406 620 428 L600 492 Q400 512 200 494 Z" fill="#3a3f52" fill-opacity="0.45" stroke-width="4"/>
    <path d="M196 440 Q400 418 604 438" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- the blackened loaf -->
  <g filter="url(#cuLfW)" stroke="#2e2a33" stroke-linejoin="round" fill="none">
    <path d="M250 424 Q254 330 340 314 Q448 296 500 344 Q528 372 524 422 Z" fill="#3a2f28" stroke-width="4"/>
    <path d="M278 372 Q330 340 400 348 Q460 354 498 376" stroke="#1e1a22" stroke-width="4" opacity="0.85"/>
    <path d="M300 402 H470 M312 388 Q380 376 452 388" stroke="#1e1a22" stroke-width="2.6" opacity="0.6"/>
    <path d="M352 330 q10 -14 22 -2 M420 322 q12 -10 20 4" stroke="#1e1a22" stroke-width="2.4" opacity="0.7"/>
  </g>

  <!-- crumbs and a fallen grey of crust -->
  <g filter="url(#cuLfW)" stroke="#2e2a33" fill="none" stroke-linecap="round">
    <circle cx="560" cy="470" r="5" fill="#3a2f28" stroke-width="1.6"/>
    <circle cx="590" cy="486" r="4" fill="#3a2f28" stroke-width="1.4"/>
    <circle cx="242" cy="470" r="4" fill="#3a2f28" stroke-width="1.4"/>
    <path d="M548 500 q10 -8 20 0 q-10 8 -20 0" fill="#2e2a33" fill-opacity="0.5" stroke-width="1.6"/>
  </g>

  <!-- knife resting on the sheet edge -->
  <g filter="url(#cuLfW)" stroke="#2e2a33" fill="none" stroke-linecap="round">
    <path d="M604 452 L700 492" stroke-width="7"/>
    <path d="M604 452 L640 468" stroke="#c9a25e" stroke-width="9"/>
    <path d="M640 468 L700 492" stroke="#e9dfc8" stroke-width="3" opacity="0.5"/>
  </g>

  <text x="120" y="120" font-family="Caveat, cursive" font-size="30" fill="#2e2a33" text-anchor="start">burnt, not raw --</text>
  <text x="140" y="156" font-family="Caveat, cursive" font-size="30" fill="#2e2a33" text-anchor="start">the oven came back</text>
  <text x="160" y="192" font-family="Caveat, cursive" font-size="30" fill="#2e2a33" text-anchor="start">without her. 11:21.</text>
</svg>
