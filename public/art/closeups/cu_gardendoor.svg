<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="cpDoorWobble" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.014" numOctaves="2" seed="89" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
    </filter>
    <filter id="cpDoorSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="cpDoorSoft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#f4ecdb"/>

  <!-- faint corner stains -->
  <g filter="url(#cpDoorSoft)">
    <ellipse cx="46" cy="40" rx="120" ry="78" fill="#c9a25e" opacity="0.12"/>
    <ellipse cx="766" cy="562" rx="140" ry="92" fill="#b0705a" opacity="0.12"/>
    <ellipse cx="762" cy="44" rx="96" ry="66" fill="#8fa3b0" opacity="0.10"/>
    <ellipse cx="44" cy="556" rx="108" ry="76" fill="#3a3f52" opacity="0.10"/>
  </g>

  <!-- door frame posts -->
  <g filter="url(#cpDoorWobble)" stroke-linecap="round">
    <rect x="60" y="70" width="68" height="480" fill="#8a6a4f" fill-opacity="0.35" stroke="#2e2a33" stroke-width="3"/>
    <rect x="660" y="70" width="74" height="480" fill="#8a6a4f" fill-opacity="0.35" stroke="#2e2a33" stroke-width="3"/>
  </g>

  <!-- sliver of rainy night through the door gap -->
  <rect x="128" y="70" width="34" height="480" fill="#3a3f52" opacity="0.92"/>
  <ellipse cx="145" cy="90" rx="40" ry="60" fill="#8fa3b0" opacity="0.12" filter="url(#cpDoorSoft2)"/>
  <g stroke="#8fa3b0" stroke-width="2" opacity="0.55" stroke-linecap="round">
    <path d="M132 84 L146 132 M138 168 L152 218 M132 250 L146 300 M140 336 L154 388 M132 420 L146 470 M138 502 L152 546"/>
  </g>

  <!-- wooden garden door planks -->
  <g filter="url(#cpDoorWobble)" stroke-linecap="round">
    <rect x="162" y="70" width="498" height="480" fill="#8a6a4f" fill-opacity="0.32" stroke="#2e2a33" stroke-width="3.5"/>
    <path d="M245 70 V550 M328 70 V550 M411 70 V550 M494 70 V550 M577 70 V550" stroke="#2e2a33" stroke-width="2.2" opacity="0.5" fill="none"/>
    <g stroke="#6b6472" stroke-width="1.6" opacity="0.2" fill="none">
      <path d="M270 90 Q266 200 272 320 Q276 440 268 530 M440 92 Q446 210 438 330 Q434 460 442 528 M600 88 Q596 220 604 340 Q608 460 598 532"/>
    </g>
    <rect x="162" y="168" width="498" height="28" fill="#8a6a4f" fill-opacity="0.4" stroke="#2e2a33" stroke-width="2.5"/>
    <rect x="162" y="428" width="498" height="28" fill="#8a6a4f" fill-opacity="0.4" stroke="#2e2a33" stroke-width="2.5"/>
    <path d="M175 445 L650 205" stroke="#8a6a4f" stroke-width="22" opacity="0.35" fill="none"/>
  </g>

  <!-- iron bolt plate -->
  <g filter="url(#cpDoorWobble)" stroke-linecap="round">
    <rect x="428" y="262" width="132" height="78" rx="8" fill="#3a3f52" fill-opacity="0.85" stroke="#2e2a33" stroke-width="3.5"/>
    <path d="M444 300 H546" stroke="#8fa3b0" stroke-width="2" opacity="0.4" fill="none"/>
    <g fill="#2e2a33" stroke="#8fa3b0" stroke-width="1.5">
      <circle cx="446" cy="280" r="6"/><circle cx="544" cy="280" r="6"/>
      <circle cx="446" cy="322" r="6"/><circle cx="544" cy="322" r="6"/>
    </g>
  </g>

  <!-- bolt handle standing open -->
  <g filter="url(#cpDoorWobble)" stroke-linecap="round">
    <path d="M452 300 L448 212 Q448 198 460 198 Q472 198 472 212 L468 300 Z" fill="#3a3f52" fill-opacity="0.85" stroke="#2e2a33" stroke-width="3"/>
    <circle cx="460" cy="194" r="15" fill="#c9a25e" fill-opacity="0.85" stroke="#2e2a33" stroke-width="3"/>
    <circle cx="460" cy="300" r="9" fill="#2e2a33" stroke="#c9a25e" stroke-width="2.5"/>
  </g>
  <ellipse cx="472" cy="312" rx="18" ry="7" fill="#2e2a33" opacity="0.15" filter="url(#cpDoorSoft2)"/>

  <!-- bright, worn keeper plate on the post -->
  <g filter="url(#cpDoorWobble)" stroke-linecap="round">
    <rect x="668" y="272" width="56" height="62" rx="6" fill="#c9a25e" fill-opacity="0.6" stroke="#2e2a33" stroke-width="3.5"/>
    <g stroke="#f4ecdb" stroke-width="2" opacity="0.55" fill="none">
      <path d="M676 288 L712 284 M678 302 L714 300 M676 318 L710 316"/>
    </g>
    <g fill="#2e2a33">
      <circle cx="678" cy="282" r="5"/><circle cx="714" cy="282" r="5"/>
      <circle cx="678" cy="324" r="5"/><circle cx="714" cy="324" r="5"/>
    </g>
  </g>

  <!-- two fresh bright scratches beside the latch -->
  <g stroke="#b4552d" fill="none" stroke-linecap="round">
    <path d="M598 232 Q616 242 634 250" stroke-width="4.5"/>
    <path d="M594 256 Q614 264 634 274" stroke-width="4"/>
    <path d="M610 244 l7 3 M604 266 l8 4" stroke-width="2" opacity="0.9"/>
  </g>

  <!-- cross-hatch shading -->
  <g stroke="#6b6472" stroke-width="2" opacity="0.25" fill="none" stroke-linecap="round">
    <path d="M200 120 L228 136 M208 146 L236 162 M214 172 L242 188"/>
    <path d="M480 470 L508 486 M502 474 L530 490 M524 478 L552 494"/>
  </g>

  <!-- annotation with arrow to the open handle -->
  <text x="556" y="104" font-family="Caveat, cursive" font-size="28" fill="#2e2a33">left off the bolt</text>
  <g stroke="#2e2a33" stroke-width="1.5" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M596 118 Q520 150 478 188"/>
    <path d="M478 188 l11 -4 M478 188 l3 11"/>
  </g>

  <!-- double ink border -->
  <g filter="url(#cpDoorWobble)" fill="none" stroke="#2e2a33" stroke-linecap="round">
    <rect x="14" y="14" width="772" height="572" stroke-width="3"/>
    <rect x="22" y="22" width="756" height="556" stroke-width="1.6"/>
  </g>
</svg>
