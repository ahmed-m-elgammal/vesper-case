<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="cpMemoirWobble" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.014" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
    </filter>
    <filter id="cpMemoirSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="cpMemoirSoft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#f4ecdb"/>

  <!-- faint corner stains -->
  <g filter="url(#cpMemoirSoft)">
    <ellipse cx="46" cy="40" rx="120" ry="78" fill="#c9a25e" opacity="0.12"/>
    <ellipse cx="766" cy="562" rx="140" ry="92" fill="#b0705a" opacity="0.12"/>
    <ellipse cx="762" cy="44" rx="96" ry="66" fill="#8fa3b0" opacity="0.10"/>
    <ellipse cx="44" cy="556" rx="108" ry="76" fill="#3a3f52" opacity="0.10"/>
  </g>

  <!-- desk washes -->
  <g filter="url(#cpMemoirSoft)">
    <ellipse cx="410" cy="486" rx="330" ry="84" fill="#8a6a4f" opacity="0.16"/>
    <ellipse cx="420" cy="168" rx="300" ry="78" fill="#8fa3b0" opacity="0.10"/>
  </g>

  <!-- stack shadow -->
  <ellipse cx="430" cy="500" rx="215" ry="26" fill="#2e2a33" opacity="0.13" filter="url(#cpMemoirSoft2)"/>

  <!-- loose sheets under the top page -->
  <g filter="url(#cpMemoirWobble)" stroke="#2e2a33" fill="#f7f1e2" stroke-linecap="round">
    <rect x="270" y="152" width="336" height="356" transform="rotate(2.6 438 330)" stroke-width="2.2"/>
    <rect x="262" y="146" width="336" height="356" transform="rotate(-2.4 430 324)" stroke-width="2.2"/>
    <rect x="274" y="158" width="336" height="356" transform="rotate(1.2 442 336)" stroke-width="2.2"/>
  </g>

  <!-- top page: title/preface -->
  <g filter="url(#cpMemoirWobble)" transform="rotate(-1.4 426 316)" stroke-linecap="round">
    <rect x="256" y="128" width="340" height="372" fill="#f7f1e2" stroke="#2e2a33" stroke-width="3"/>
    <g fill="none" stroke="#6b6472" stroke-width="2.2" opacity="0.75">
      <path d="M300 216 H540 M300 232 H558 M300 248 H530 M300 264 H548"/>
      <path d="M300 294 H546 M300 310 H560 M300 326 H538 M300 342 H552 M300 358 H522"/>
      <path d="M300 388 H550 M300 404 H534 M300 420 H546"/>
      <path d="M300 452 H526"/>
    </g>
    <path d="M296 198 Q426 210 558 196" fill="none" stroke="#2e2a33" stroke-width="2" opacity="0.7"/>
  </g>
  <g transform="rotate(-1.4 426 316)">
    <text x="426" y="182" font-family="Caveat, cursive" font-size="36" fill="#2e2a33" text-anchor="middle">A Confession of Sorts</text>
  </g>

  <!-- whiskey stain blooming across the top page corner -->
  <g filter="url(#cpMemoirSoft2)">
    <path d="M542 118 C564 104 596 104 612 122 C630 142 630 170 614 188 C598 206 570 208 552 194 C530 178 524 136 542 118 Z" fill="#8a6a4f" opacity="0.28"/>
    <path d="M556 130 C570 122 590 122 600 134 C612 148 610 166 598 176 C584 188 564 186 556 172 C548 158 546 138 556 130 Z" fill="#8a6a4f" opacity="0.30"/>
    <ellipse cx="584" cy="152" rx="42" ry="36" fill="none" stroke="#8a6a4f" stroke-width="3" opacity="0.5"/>
    <circle cx="600" cy="198" r="5" fill="#8a6a4f" opacity="0.35"/>
    <circle cx="590" cy="208" r="3" fill="#8a6a4f" opacity="0.3"/>
  </g>

  <!-- binding spine: signatures, gap, torn threads -->
  <g filter="url(#cpMemoirWobble)" stroke-linecap="round">
    <rect x="232" y="140" width="30" height="376" transform="rotate(-1.4 247 328)" fill="#8fa3b0" fill-opacity="0.30" stroke="#2e2a33" stroke-width="2.5"/>
    <g fill="none" stroke="#2e2a33" stroke-width="2.2">
      <path d="M228 172 Q247 180 266 172"/>
      <path d="M228 194 Q247 202 266 194"/>
      <path d="M228 216 Q247 224 266 216"/>
      <path d="M228 238 Q247 246 266 238"/>
    </g>
    <path d="M232 272 L240 282 L235 292 L242 302 L236 312" fill="none" stroke="#2e2a33" stroke-width="2"/>
    <path d="M236 366 L242 356 L238 346 L244 336 L239 326" fill="none" stroke="#2e2a33" stroke-width="2"/>
    <g fill="none" stroke="#2e2a33" stroke-width="1.6" opacity="0.8">
      <path d="M246 280 Q252 296 245 310"/>
      <path d="M252 284 Q247 300 254 314"/>
      <path d="M245 352 Q252 340 247 328"/>
    </g>
    <g fill="none" stroke="#2e2a33" stroke-width="2.2">
      <path d="M228 392 Q247 400 266 392"/>
      <path d="M228 414 Q247 422 266 414"/>
      <path d="M228 436 Q247 444 266 436"/>
      <path d="M228 458 Q247 466 266 458"/>
    </g>
  </g>

  <!-- paper slip tucked at page 39 -->
  <g transform="rotate(-9 222 336)">
    <rect x="188" y="322" width="68" height="28" fill="#f7f1e2" stroke="#2e2a33" stroke-width="2"/>
    <text x="222" y="343" font-family="Caveat, cursive" font-size="26" fill="#2e2a33" text-anchor="middle">39</text>
  </g>

  <!-- cross-hatch shading -->
  <g stroke="#6b6472" stroke-width="2" opacity="0.35" stroke-linecap="round" fill="none">
    <path d="M292 496 L320 484 M336 500 L364 488 M380 502 L408 490 M424 502 L452 490 M468 500 L496 488 M510 496 L538 484"/>
    <path d="M312 490 L336 502 M396 490 L420 502 M476 490 L500 502"/>
  </g>

  <!-- annotation at the gap -->
  <text x="46" y="300" font-family="Caveat, cursive" font-size="28" fill="#2e2a33">pages 40–43 gone</text>
  <g stroke="#2e2a33" stroke-width="1.6" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M212 294 Q244 288 260 306"/>
    <path d="M260 306 l-10 -1 M260 306 l-4 -9"/>
  </g>

  <!-- double ink border -->
  <g filter="url(#cpMemoirWobble)" fill="none" stroke="#2e2a33" stroke-linecap="round">
    <rect x="14" y="14" width="772" height="572" stroke-width="3"/>
    <rect x="22" y="22" width="756" height="556" stroke-width="1.6"/>
  </g>
</svg>
