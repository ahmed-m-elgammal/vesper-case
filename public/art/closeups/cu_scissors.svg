<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <filter id="cpScisWobble" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.014" numOctaves="2" seed="101" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6"/>
    </filter>
    <filter id="cpScisSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="cpScisSoft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#f4ecdb"/>

  <!-- faint corner stains -->
  <g filter="url(#cpScisSoft)">
    <ellipse cx="46" cy="40" rx="120" ry="78" fill="#c9a25e" opacity="0.12"/>
    <ellipse cx="766" cy="562" rx="140" ry="92" fill="#b0705a" opacity="0.12"/>
    <ellipse cx="762" cy="44" rx="96" ry="66" fill="#8fa3b0" opacity="0.10"/>
    <ellipse cx="44" cy="556" rx="108" ry="76" fill="#3a3f52" opacity="0.10"/>
  </g>

  <!-- wall wash and sideboard top -->
  <ellipse cx="400" cy="110" rx="340" ry="100" fill="#8fa3b0" opacity="0.12" filter="url(#cpScisSoft)"/>
  <g filter="url(#cpScisWobble)" stroke-linecap="round">
    <rect x="60" y="140" width="680" height="330" fill="#8a6a4f" fill-opacity="0.22" stroke="#2e2a33" stroke-width="3.5"/>
    <rect x="60" y="470" width="680" height="60" fill="#8a6a4f" fill-opacity="0.35" stroke="#2e2a33" stroke-width="3.5"/>
    <g stroke="#6b6472" stroke-width="1.6" opacity="0.2" fill="none">
      <path d="M80 200 Q400 194 720 200 M80 262 Q400 256 720 262 M80 324 Q400 318 720 324 M80 386 Q400 380 720 386 M80 444 Q400 438 720 444"/>
    </g>
  </g>

  <!-- shadows -->
  <ellipse cx="440" cy="436" rx="175" ry="20" fill="#2e2a33" opacity="0.14" filter="url(#cpScisSoft2)"/>
  <ellipse cx="612" cy="372" rx="92" ry="16" fill="#2e2a33" opacity="0.14" filter="url(#cpScisSoft2)"/>

  <!-- loose thread passing under the blades -->
  <g fill="none" stroke="#b0705a" stroke-width="2.5" opacity="0.9" stroke-linecap="round">
    <path d="M300 330 Q390 352 480 372 Q525 381 562 392"/>
    <path d="M300 330 Q288 336 292 348 Q296 356 306 352"/>
  </g>

  <!-- sewing scissors with brass bows -->
  <g transform="rotate(16 380 330)">
    <g filter="url(#cpScisWobble)" stroke-linecap="round">
      <path d="M378 340 Q344 322 328 296" fill="none" stroke="#2e2a33" stroke-width="4.5"/>
      <path d="M384 322 Q358 300 346 274" fill="none" stroke="#2e2a33" stroke-width="4.5"/>
      <ellipse cx="312" cy="268" rx="40" ry="27" transform="rotate(-18 312 268)" fill="none" stroke="#c9a25e" stroke-width="11" opacity="0.85"/>
      <ellipse cx="312" cy="268" rx="40" ry="27" transform="rotate(-18 312 268)" fill="none" stroke="#2e2a33" stroke-width="2.2"/>
      <ellipse cx="350" cy="304" rx="36" ry="24" transform="rotate(-18 350 304)" fill="none" stroke="#c9a25e" stroke-width="10" opacity="0.85"/>
      <ellipse cx="350" cy="304" rx="36" ry="24" transform="rotate(-18 350 304)" fill="none" stroke="#2e2a33" stroke-width="2.2"/>
      <path d="M382 322 L570 398 L566 412 L378 340 Z" fill="#8fa3b0" fill-opacity="0.55" stroke="#2e2a33" stroke-width="2.5"/>
      <path d="M382 322 L552 356 L548 370 L378 342 Z" fill="#8fa3b0" fill-opacity="0.72" stroke="#2e2a33" stroke-width="2.5"/>
      <circle cx="381" cy="331" r="8" fill="#2e2a33" stroke="#c9a25e" stroke-width="2.5"/>
    </g>
    <path d="M400 330 L540 384" stroke="#f4ecdb" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <path d="M400 326 L530 352" stroke="#f4ecdb" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  </g>

  <!-- red pincushion with pins -->
  <g filter="url(#cpScisWobble)" stroke-linecap="round">
    <ellipse cx="612" cy="300" rx="72" ry="56" fill="#b0705a" fill-opacity="0.78" stroke="#2e2a33" stroke-width="3"/>
    <g stroke="#2e2a33" stroke-width="2" opacity="0.45" fill="none">
      <path d="M588 248 Q578 300 588 350 M636 248 Q646 300 636 350 M612 244 L612 352"/>
    </g>
    <path d="M604 246 Q612 234 620 246" fill="none" stroke="#2e2a33" stroke-width="2.5"/>
    <circle cx="612" cy="246" r="5" fill="#c9a25e" stroke="#2e2a33" stroke-width="1.5"/>
    <g stroke="#2e2a33" stroke-width="2">
      <path d="M586 258 L560 232 M640 254 L668 226 M660 318 L688 338 M566 328 L540 352"/>
    </g>
    <g fill="#c9a25e" stroke="#2e2a33" stroke-width="1.5">
      <circle cx="556" cy="228" r="6"/><circle cx="672" cy="222" r="6"/>
      <circle cx="692" cy="342" r="6"/><circle cx="536" cy="356" r="6"/>
    </g>
  </g>

  <!-- cross-hatch shading -->
  <g stroke="#6b6472" stroke-width="2" opacity="0.28" fill="none" stroke-linecap="round">
    <path d="M580 250 L600 264 M578 276 L598 290 M580 302 L600 316 M582 328 L602 342"/>
    <path d="M648 268 L630 284 M652 296 L634 312"/>
  </g>

  <!-- annotation -->
  <text x="60" y="92" font-family="Caveat, cursive" font-size="28" fill="#2e2a33">peggy's — far from her sewing</text>

  <!-- double ink border -->
  <g filter="url(#cpScisWobble)" fill="none" stroke="#2e2a33" stroke-linecap="round">
    <rect x="14" y="14" width="772" height="572" stroke-width="3"/>
    <rect x="22" y="22" width="756" height="556" stroke-width="1.6"/>
  </g>
</svg>
