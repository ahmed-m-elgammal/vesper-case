    <rect x="1756" y="382" width="76" height="96" rx="8" stroke-width="3.4" fill="#c9a25e" fill-opacity="0.55"/>
    <circle cx="1794" cy="414" r="13" stroke-width="3.2"/>
    <path d="M1794 427 V448 M1786 448 H1802" stroke-width="3.2"/>
