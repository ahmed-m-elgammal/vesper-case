    <!-- sandwich in hand -->
    <path d="M462 640 L506 632 L510 656 L466 664 Z" fill="#c9a25e" fill-opacity="0.75" stroke-width="2.6"/>
  </g>

  <!-- coat pegs + plant by the stairs -->
  <g filter="url(#upWobble)" stroke="#2e2a33" fill="none" stroke-linecap="round">
    <path d="M330 480 H420" stroke-width="3.4"/>
    <path d="M352 480 V460 M378 480 V458 M404 480 V461" stroke-width="2.6"/>
    <path d="M352 480 Q344 520 356 552 L372 552 Q382 518 374 480" stroke-width="3" fill="#5e4632" fill-opacity="0.4"/>
    <!-- potted plant -->
    <path d="M364 620 Q344 590 356 566 M364 620 Q380 588 372 560 M364 620 Q364 590 364 566" stroke-width="2.8" stroke="#2c7a4b" fill="none"/>
    <path d="M348 620 H382 L376 664 H354 Z" stroke-width="3" fill="#b4552d" fill-opacity="0.5"/>
  </g>

  <!-- framing (same double border as every scene) -->
  <g filter="url(#upWobble)" stroke="#2e2a33" fill="none" stroke-linecap="round">
    <rect x="14" y="14" width="1892" height="1052" stroke-width="3.6"/>
    <rect x="24" y="24" width="1872" height="1032" stroke-width="1.8" opacity="0.7"/>
  </g>
</svg>
