    <rect x="1718" y="248" width="156" height="64" rx="4" stroke-width="3" fill="#f4ecdb" fill-opacity="0.9"/>
    <text x="1796" y="276" font-family="Special Elite, serif" font-size="21" fill="#2e2a33" stroke="none" text-anchor="middle">SIGNED KEYS</text>
    <text x="1796" y="300" font-family="Special Elite, serif" font-size="21" fill="#2e2a33" stroke="none" text-anchor="middle">ONLY</text>
  </g>

  <!-- stairs down (left edge) -->
  <g filter="url(#upWobble)" stroke="#2e2a33" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 470 V964" stroke-width="4.4"/>
    <path d="M96 470 V940" stroke-width="3" opacity="0.7"/>
    <path d="M60 520 H160 M60 586 H184 M60 652 H208 M60 718 H232 M60 784 H256 M60 850 H280 M60 916 H280" stroke-width="4"/>
    <path d="M160 520 L184 586 L208 652 L232 718 L256 784 L280 850" stroke-width="2.4" opacity="0.6"/>
    <!-- handrail -->
    <path d="M84 440 Q90 300 110 250" stroke-width="4"/>
    <path d="M84 440 H160 M110 250 H176" stroke-width="3" opacity="0.6"/>
    <!-- BULLPEN sign -->
    <rect x="62" y="404" width="128" height="58" rx="4" stroke-width="3.2" fill="#2e3a52" fill-opacity="0.85"/>
    <text x="126" y="432" font-family="Caveat, cursive" font-size="30" fill="#e8b24a" stroke="none" text-anchor="middle">BULLPEN</text>
    <text x="126" y="456" font-family="Caveat, cursive" font-size="26" fill="#e8b24a" stroke="none" text-anchor="middle">&#8595; down</text>
  </g>

  <!-- canteen long table + benches -->
  <g filter="url(#upWobble)" stroke="#2e2a33" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M244 640 Q470 626 700 640 L712 700 Q470 716 232 700 Z" fill="#5e4632" fill-opacity="0.5" stroke-width="4"/>
    <path d="M268 700 V900 M676 706 V900" stroke-width="4"/>
    <!-- bench behind -->
    <path d="M300 566 H640 M320 566 V612 M600 566 V612" stroke-width="3.6"/>
    <!-- teapot + mugs -->
    <path d="M330 596 Q368 578 406 596 L398 626 Q368 636 338 626 Z" fill="#3a3f52" fill-opacity="0.7" stroke-width="3"/>
    <path d="M406 600 Q428 602 424 622" stroke-width="2.6"/>
    <path d="M366 578 V562 M362 562 H372" stroke-width="2.6"/>
    <path d="M446 608 H472 V630 H446 Z" fill="#e8b24a" fill-opacity="0.6" stroke-width="2.6"/>
    <path d="M490 606 H516 V628 H490 Z" fill="#e8b24a" fill-opacity="0.6" stroke-width="2.6"/>
    <!-- sandwich plate + clipboard (Cray's) -->
    <ellipse cx="560" cy="622" rx="42" ry="12" stroke-width="2.8" fill="#f4ecdb" fill-opacity="0.8"/>
    <path d="M530 614 Q546 600 562 612 Q578 602 594 614" stroke-width="2.6" fill="#c9a25e" fill-opacity="0.4"/>
    <rect x="612" y="588" width="64" height="40" rx="4" stroke-width="2.8" fill="#f4ecdb" fill-opacity="0.85" transform="rotate(-4 644 608)"/>
    <path d="M620 598 H660 M622 608 H656" stroke-width="1.8" opacity="0.6" transform="rotate(-4 644 608)"/>
  </g>

  <!-- Quill's counter + typewriter -->
  <g filter="url(#upWobble)" stroke="#2e2a33" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1214 672 Q1420 658 1656 672 L1660 736 Q1420 750 1210 736 Z" fill="#5e4632" fill-opacity="0.55" stroke-width="4"/>
    <path d="M1240 736 V932 M1620 742 V932" stroke-width="4"/>
