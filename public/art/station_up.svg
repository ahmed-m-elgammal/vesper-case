  <g filter="url(#upWobble)" stroke="#2e2a33" stroke-width="2.2" opacity="0.8" fill="none">
    <path d="M576 354 L660 366 Q668 368 662 376 L640 398" fill="#e8b24a" fill-opacity="0.6"/>
    <text x="700" y="384" font-family="Caveat, cursive" font-size="34" fill="#2e2a33" stroke="none" transform="rotate(-2 700 384)">canteen notices</text>
  </g>

  <!-- stove + kettle -->
  <g filter="url(#upWobble)" stroke="#2e2a33" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="892" y="330" width="212" height="196" stroke-width="4" fill="#3a3f52" fill-opacity="0.82"/>
    <path d="M904 352 H892 M1040 330 H1104" stroke-width="3"/>
    <rect x="912" y="372" width="80" height="54" stroke-width="2.8" fill="#e8b24a" fill-opacity="0.5"/>
    <path d="M1014 372 V402 M1006 402 H1022" stroke-width="2.6"/>
    <path d="M920 470 H1076" stroke-width="2.6" opacity="0.7"/>
    <!-- kettle -->
    <path d="M958 296 Q998 282 1038 296 L1030 326 Q998 336 966 326 Z" fill="#e8b24a" fill-opacity="0.85" stroke-width="3.4"/>
    <path d="M1038 300 Q1062 302 1058 322" stroke-width="3"/>
    <path d="M958 296 Q934 300 940 320" stroke-width="3"/>
    <path d="M990 282 Q986 266 1000 260" stroke-width="3"/>
    <!-- steam -->
    <path d="M986 246 Q978 230 990 216 M1006 248 Q1000 234 1012 222" stroke-width="2.4" opacity="0.5"/>
  </g>

  <!-- radio on wall bracket -->
  <g filter="url(#upWobble)" stroke="#2e2a33" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1128 258 H1300" stroke-width="4"/>
    <path d="M1160 258 V232 M1268 258 V232" stroke-width="3"/>
    <rect x="1152" y="272" width="130" height="126" rx="10" stroke-width="4" fill="#5e4632" fill-opacity="0.8"/>
    <path d="M1168 292 Q1217 282 1266 292" stroke-width="2.6" opacity="0.7"/>
    <circle cx="1204" cy="330" r="26" stroke-width="3" fill="#c9a25e" fill-opacity="0.35"/>
    <circle cx="1256" cy="330" r="16" stroke-width="3" fill="#c9a25e" fill-opacity="0.35"/>
