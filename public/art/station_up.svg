    <path d="M1298 300 Q1318 336 1298 372 M1316 290 Q1344 336 1316 384" stroke-width="2.4" opacity="0.45"/>
  </g>

  <!-- archive shelves + grey boxes -->
  <g filter="url(#upWobble)" stroke="#2e2a33" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1322" y="118" width="336" height="540" stroke-width="4.4" fill="#5e4632" fill-opacity="0.28"/>
    <path d="M1322 232 H1658 M1322 346 H1658 M1322 460 H1658 M1322 574 H1658" stroke-width="3.6"/>
    <!-- grey evidence boxes on the shelves -->
    <g fill="#8a8f98" fill-opacity="0.6" stroke-width="3">
      <rect x="1338" y="176" width="88" height="52" rx="3"/>
      <rect x="1440" y="176" width="88" height="52" rx="3"/>
      <rect x="1544" y="176" width="92" height="52" rx="3"/>
      <rect x="1342" y="290" width="92" height="52" rx="3"/>
      <rect x="1550" y="290" width="86" height="52" rx="3"/>
      <rect x="1338" y="404" width="88" height="52" rx="3"/>
      <rect x="1444" y="404" width="92" height="52" rx="3"/>
    </g>
    <g stroke-width="2.2" opacity="0.75">
