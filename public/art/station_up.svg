    <circle cx="1416" cy="428" r="34" fill-opacity="0.88"/>
    <circle cx="1450" cy="416" r="18" fill-opacity="0.88"/>
    <!-- glasses glint -->
    <path d="M1392 486 Q1406 478 1420 486 M1428 486 Q1442 478 1456 486" stroke="#e8b24a" stroke-width="3" fill="none"/>
  </g>

  <!-- Dr. Cray (silhouette at the canteen table) -->
  <g filter="url(#upWobble)" fill="#2e2a33" stroke="#2e2a33" stroke-linecap="round">
    <path d="M368 520 Q356 548 366 576 Q374 596 392 604 Q378 632 382 664 Q386 700 410 716 L400 780 L560 780 L552 716 Q576 700 580 664 Q584 630 570 604 Q586 594 592 574 Q600 546 588 522 Q574 494 540 490 L536 512 Q478 500 420 512 L414 492 Q384 496 368 520" fill-opacity="0.88"/>
