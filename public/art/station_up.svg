<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="upWobble" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.014" numOctaves="2" seed="37" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
    </filter>
    <filter id="upSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="upSoft2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <pattern id="upFloor" width="120" height="70" patternUnits="userSpaceOnUse">
      <path d="M0 1 H120 M0 36 H120" stroke="#6b5233" stroke-width="2.4" opacity="0.35" fill="none"/>
      <path d="M34 1 V36 M86 1 V36 M12 36 V70 M62 36 V70 M108 36 V70" stroke="#6b5233" stroke-width="2.4" opacity="0.35" fill="none"/>
    </pattern>
    <pattern id="upBrick" width="86" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 1 H86 M0 20 H86 M0 39 H86" stroke="#8a5a3c" stroke-width="1.6" opacity="0.22" fill="none"/>
      <path d="M24 1 V20 M64 20 V39" stroke="#8a5a3c" stroke-width="1.6" opacity="0.22" fill="none"/>
    </pattern>
  </defs>

  <!-- paper base -->
  <rect width="1920" height="1080" fill="#f4ecdb"/>

  <!-- warm upper-floor washes -->
  <g filter="url(#upSoft)">
    <ellipse cx="500" cy="240" rx="560" ry="200" fill="#c9a25e" opacity="0.26"/>
    <ellipse cx="1460" cy="260" rx="420" ry="220" fill="#9aa88f" opacity="0.16"/>
    <ellipse cx="480" cy="760" rx="480" ry="220" fill="#c9a25e" opacity="0.14"/>
    <ellipse cx="1400" cy="820" rx="500" ry="220" fill="#6b5233" opacity="0.16"/>
    <ellipse cx="900" cy="420" rx="360" ry="260" fill="#3a3f52" opacity="0.10"/>
  </g>

  <!-- back wall brick + floor -->
  <g filter="url(#upWobble)">
    <rect x="30" y="110" width="1860" height="600" fill="#e3d3b3" opacity="0.5"/>
    <rect x="30" y="110" width="1860" height="600" fill="url(#upBrick)"/>
    <rect x="0" y="700" width="1920" height="380" fill="url(#upFloor)"/>
    <path d="M-10 704 Q480 690 960 700 T1930 694" stroke="#6b5233" stroke-width="4" fill="none" opacity="0.7"/>
  </g>

  <!-- ceiling + hanging lamps -->
  <g filter="url(#upWobble)" stroke="#2e2a33" fill="none" stroke-linecap="round">
    <path d="M-10 92 Q480 44 960 84 T1930 66" stroke-width="4"/>
    <path d="M480 78 V208 M1280 72 V196" stroke-width="3"/>
    <path d="M438 208 H522 L506 248 H454 Z" fill="#e8b24a" fill-opacity="0.8" stroke-width="4"/>
    <path d="M1238 196 H1322 L1306 236 H1254 Z" fill="#e8b24a" fill-opacity="0.8" stroke-width="4"/>
  </g>

  <!-- rain window (canteen end) -->
  <g filter="url(#upWobble)" stroke="#2e2a33" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="206" y="196" width="320" height="270" stroke-width="4" fill="#b9c2c9" fill-opacity="0.35"/>
    <path d="M366 196 V466 M206 336 H526" stroke-width="2.6" opacity="0.7"/>
    <rect x="180" y="176" width="372" height="16" stroke-width="3.4" fill="#e3d3b3"/>
    <path d="M240 240 L290 420 M330 210 L390 440 M450 250 L482 400" stroke="#8fa3b0" stroke-width="2.4" opacity="0.5"/>
    <path d="M226 470 Q366 452 506 470" stroke-width="3.4"/>
  </g>

  <!-- canteen notice board -->
  <g filter="url(#upWobble)" stroke="#2e2a33" fill="none" stroke-linejoin="round">
    <rect x="548" y="142" width="288" height="206" stroke-width="4" fill="#a4713e" fill-opacity="0.4"/>
    <rect x="566" y="160" width="112" height="78" stroke-width="2.6" fill="#f4ecdb" fill-opacity="0.85"/>
    <rect x="700" y="160" width="112" height="78" stroke-width="2.6" fill="#f4ecdb" fill-opacity="0.85"/>
    <rect x="600" y="258" width="150" height="66" stroke-width="2.6" fill="#f4ecdb" fill-opacity="0.85"/>
    <path d="M594 178 H646 M594 194 H660 M594 210 H634" stroke-width="2" opacity="0.6"/>
    <path d="M716 178 H768 M716 194 H782" stroke-width="2" opacity="0.6"/>
