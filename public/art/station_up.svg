      <path d="M1460 316 H1520 M1464 316 V330 M1464 316 V302" />
      <path d="M1458 430 H1518 M1462 430 V444 M1462 430 V416" />
    </g>
    <!-- tan file spines -->
    <g stroke-width="2.6" stroke="#2e2a33">
      <path d="M1352 348 H1368 V338 H1352 Z M1376 348 H1392 V336 H1376 Z M1400 348 H1416 V340 H1400 Z" fill="#c9a25e" fill-opacity="0.5"/>
      <path d="M1544 464 H1560 V452 H1544 Z M1568 464 H1584 V454 H1568 Z" fill="#c9a25e" fill-opacity="0.5"/>
      <path d="M1348 580 H1364 V570 H1348 Z M1372 580 H1388 V572 H1372 Z" fill="#c9a25e" fill-opacity="0.5"/>
    </g>
