    <path d="M1300 636 Q1340 616 1380 636 L1372 668 Q1340 678 1308 668 Z" fill="#3a3f52" fill-opacity="0.85" stroke-width="3.2"/>
    <path d="M1312 632 L1322 606 L1358 606 L1368 632" stroke-width="2.8"/>
    <rect x="1326" y="580" width="30" height="28" stroke-width="2.6" fill="#f4ecdb" fill-opacity="0.9" transform="rotate(-3 1341 594)"/>
    <path d="M1316 648 H1364" stroke-width="2.2" opacity="0.7"/>
    <circle cx="1392" cy="650" r="9" stroke-width="2.4"/>
    <!-- paper stacks -->
    <path d="M1452 664 H1548 L1540 676 H1444 Z" stroke-width="2.8" fill="#f4ecdb" fill-opacity="0.9"/>
    <path d="M1456 654 H1544 L1538 664 H1448 Z" stroke-width="2.4" fill="#f4ecdb" fill-opacity="0.85"/>
    <path d="M1462 646 H1536 L1532 654 H1456 Z" stroke-width="2.2" fill="#f4ecdb" fill-opacity="0.8"/>
    <!-- bell + stamp pad -->
    <circle cx="1588" cy="660" r="10" stroke-width="2.6" fill="#c9a25e" fill-opacity="0.5"/>
    <rect x="1604" y="654" width="34" height="14" rx="3" stroke-width="2.4" fill="#b4552d" fill-opacity="0.4"/>
  </g>

  <!-- Miss Quill (silhouette at her counter) -->
  <g filter="url(#upWobble)" fill="#2e2a33" stroke="#2e2a33" stroke-linecap="round">
    <path d="M1382 470 Q1372 500 1360 520 Q1344 546 1348 576 Q1352 600 1368 612 L1352 672 Q1370 680 1392 682 L1444 682 Q1466 678 1480 668 L1464 610 Q1480 596 1484 570 Q1488 540 1472 514 Q1458 492 1450 470 Q1440 440 1416 438 Q1392 440 1382 470" fill-opacity="0.88"/>
