    <path d="M1478 574 L1478 540 L1604 540 L1604 574" stroke-width="3.4" fill="#5e4632" fill-opacity="0.35"/>
    <path d="M1530 556 H1552" stroke-width="2.6"/>
    <path d="M1490 536 L1520 516" stroke-width="2.2" opacity="0.7"/>
  </g>

  <!-- records room door (signed keys only) -->
  <g filter="url(#upWobble)" stroke="#2e2a33" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1696" y="146" width="196" height="514" stroke-width="4.6" fill="#4a3a2a" fill-opacity="0.85"/>
    <rect x="1714" y="168" width="160" height="470" stroke-width="2.6" opacity="0.6"/>
    <path d="M1714 336 H1874 M1714 504 H1874" stroke-width="2.2" opacity="0.5"/>
