    <path d="M-10 96 Q480 40 960 82 T1930 70" stroke-width="4"/>
    <path d="M300 84 V210 M960 78 V186 M1620 70 V216" stroke-width="3"/>
    <path d="M258 210 H342 L326 250 H274 Z" fill="#e8b24a" fill-opacity="0.8" stroke-width="4"/>
    <path d="M918 186 H1002 L986 226 H934 Z" fill="#e8b24a" fill-opacity="0.8" stroke-width="4"/>
    <path d="M1578 216 H1662 L1646 256 H1594 Z" fill="#e8b24a" fill-opacity="0.8" stroke-width="4"/>
  </g>
  <g filter="url(#inSoft2)" fill="#e8b24a" opacity="0.22">
