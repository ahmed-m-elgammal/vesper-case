<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <filter id="plWobble" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.015" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
    </filter>
    <filter id="plSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="900" height="620" fill="#f4ecdb"/>
  <g filter="url(#plSoft)">
    <ellipse cx="240" cy="150" rx="300" ry="140" fill="#8fa3b0" opacity="0.16"/>
    <ellipse cx="680" cy="470" rx="280" ry="130" fill="#c9a25e" opacity="0.18"/>
  </g>

  <g font-family="Caveat, cursive" fill="#2e2a33">
    <!-- GROUND FLOOR -->
    <g filter="url(#plWobble)" stroke="#2e2a33" fill="none" stroke-width="4" stroke-linecap="round">
      <rect x="60" y="330" width="560" height="240" fill="#e9dfc8"/>
      <path d="M240 330 V570 M440 330 V570" stroke-width="3"/>
      <rect x="640" y="330" width="200" height="240" fill="#e9dfc8"/>
      <path d="M640 450 H840" stroke-width="2" opacity="0.5"/>
      <!-- front door -->
      <path d="M60 400 h-16 M60 480 h-16" stroke-width="3"/>
      <path d="M44 396 q8 44 0 88" stroke-width="3"/>
      <!-- garden door -->
      <path d="M640 500 h-14 M626 500 v60 h14" stroke-width="3"/>
    </g>
    <text x="150" y="360" font-size="30">Entrance Hall</text>
    <text x="150" y="388" font-size="19" opacity="0.6">clock · ledger · stairs</text>
    <text x="300" y="360" font-size="30">The Parlour</text>
    <text x="300" y="388" font-size="19" opacity="0.6">the crime scene</text>
    <text x="470" y="360" font-size="30">Kitchen</text>
    <text x="458" y="388" font-size="19" opacity="0.6">stove · garden door</text>
    <text x="690" y="360" font-size="30">Study</text>
    <text x="672" y="388" font-size="19" opacity="0.6">desk · safe</text>
    <text x="30" y="300" font-size="24" opacity="0.7">front door</text>
    <text x="560" y="600" font-size="24" opacity="0.7">kitchen garden</text>

    <!-- UPPER FLOOR -->
    <g filter="url(#plWobble)" stroke="#2e2a33" fill="none" stroke-width="4" stroke-linecap="round">
      <rect x="60" y="120" width="500" height="160" fill="#e9dfc8"/>
      <path d="M230 120 V280 M400 120 V280" stroke-width="3"/>
      <rect x="580" y="120" width="260" height="160" fill="#e9dfc8"/>
    </g>
    <text x="90" y="150" font-size="27">Peggy's Room</text>
    <text x="255" y="150" font-size="27">Edmund's Room</text>
    <text x="428" y="150" font-size="27">Bathroom</text>
    <text x="640" y="150" font-size="27">Landing</text>
    <text x="648" y="176" font-size="19" opacity="0.6">stairs up &amp; down</text>

    <!-- ATTIC -->
    <g filter="url(#plWobble)" stroke="#2e2a33" fill="none" stroke-width="4" stroke-linecap="round">
      <path d="M60 100 L200 30 L700 30 L840 100" fill="#e9dfc8"/>
      <rect x="330" y="52" width="240" height="46" fill="#d9c8a6" opacity="0.6"/>
    </g>
    <text x="380" y="84" font-size="28">Attic Studio</text>
    <text x="410" y="106" font-size="19" opacity="0.6">easel · sketchbooks</text>

    <!-- BASEMENT NOTE -->
    <text x="150" y="588" font-size="22" opacity="0.75">below: cellar -- laundry &amp; cot</text>

    <!-- STAIR PATH -->
    <g filter="url(#plWobble)" stroke="#b4552d" fill="none" stroke-width="3" stroke-dasharray="7 7">
      <path d="M140 560 L140 470 M140 470 q-20 -30 0 -50"/>
      <path d="M140 300 q-14 -26 0 -44 L648 190"/>
      <path d="M700 190 q10 -60 10 -90"/>
    </g>
    <text x="96" y="520" font-size="22" fill="#b4552d">stairs</text>

    <!-- ACT LOCKS -->
    <g font-family="Caveat, cursive" font-size="20" fill="#b4552d" opacity="0.9">
      <text x="470" y="410">Act 2 -- locked</text>
      <text x="690" y="410">Act 3 -- locked</text>
      <text x="90" y="188">Act 3 -- locked</text>
      <text x="255" y="188">Act 3 -- locked</text>
      <text x="428" y="188">Act 3 -- locked</text>
      <text x="640" y="208">Act 2 -- locked</text>
      <text x="380" y="130">Act 4 -- locked</text>
    </g>
    <text x="288" y="410" font-size="20" fill="#b4552d">Act 1 -- open</text>
  </g>
</svg>
